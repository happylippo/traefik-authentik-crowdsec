services:
  socket-proxy-authentik:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy-authentik
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "1"
      EXEC: "0"
      NETWORKS: "0"
      IMAGES: "0"
      VOLUMES: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SWARM: "0"
      BUILD: "0"
      COMMIT: "0"
      GRPC: "0"
      AUTH: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SESSION: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      authentik_socket_proxy:
        ipv4_address: ${SOCKET_PROXY_AUTHENTIK_IPV4:-172.31.194.10}
        ipv6_address: ${SOCKET_PROXY_AUTHENTIK_IPV6:-fd00:1:be:f::10}
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2375/_ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    tmpfs:
      - /run

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    environment:
      INFO: "1"
      CONTAINERS: "1"
      POST: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      GRPC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2375/_ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      socket_proxy:
        ipv4_address: ${SOCKET_PROXY_IPV4:-172.31.192.10}
        ipv6_address: ${SOCKET_PROXY_IPV6:-fd00:1:be:c::10}
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  socket-proxy-manager:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy-manager
    environment:
      INFO: "1"
      CONTAINERS: "1"
      ALLOW_LOGS: "1"
      EXEC: "1"
      NETWORKS: "1"
      POST: "1"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      GRPC: "0"
      IMAGES: "0"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2375/_ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      crowdsec_manager_socket_proxy:
        ipv4_address: ${SOCKET_PROXY_MANAGER_IPV4:-172.31.193.10}
        ipv6_address: ${SOCKET_PROXY_MANAGER_IPV6:-fd00:1:be:e::10}
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
