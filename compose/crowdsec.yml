services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    depends_on:
      socket-proxy:
        condition: service_healthy
    env_file: ${ABSOLUTE_PATH}/data/crowdsec/.env
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 20s
      timeout: 2s
      retries: 5
      start_period: 10s
    networks:
      crowdsec:
        ipv4_address: ${CROWDSEC_IPV4:-172.31.64.10}
        ipv6_address: ${CROWDSEC_IPV6:-fd00:1:be:b::10}
      socket_proxy:
        ipv4_address: ${CROWDSEC_SOCKET_PROXY_IPV4:-172.31.192.20}
        ipv6_address: ${CROWDSEC_SOCKET_PROXY_IPV6:-fd00:1:be:c::20}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${ABSOLUTE_PATH}/data/crowdsec/config:/etc/crowdsec
      - ${ABSOLUTE_PATH}/data/crowdsec/data:/var/lib/crowdsec/data
      - ${ABSOLUTE_PATH}/data/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ${ABSOLUTE_PATH}/data/crowdsec/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - ${ABSOLUTE_PATH}/data/traefik/logs:/var/log/traefik:ro
      - /var/log/auth.log:/var/log/auth.log:ro
      - /var/log/syslog:/var/log/syslog:ro

