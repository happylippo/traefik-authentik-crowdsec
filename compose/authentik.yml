services:
  postgresql:
    image: postgres:16-alpine
    container_name: authentik-database
    env_file: ${ABSOLUTE_PATH}/.env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?Run ./scripts/setup.sh to generate secrets}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      authentik_internal:
        ipv4_address: ${POSTGRES_IPV4:-172.31.0.10}
        ipv6_address: ${POSTGRES_IPV6:-fd00:1:be:d::10}
    restart: unless-stopped
    volumes:
      - authentik_database:/var/lib/postgresql/data

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8}
    container_name: authentik-server
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?Run ./scripts/setup.sh to generate secrets}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Run ./scripts/setup.sh to generate secrets}
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: ${AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS:-172.31.128.0/24,fd00:1:be:a::/64}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK_NAME:-proxy}
      traefik.http.routers.authentik.rule: "Host(`${AUTHENTIK_HOST:-auth.localhost}`)"
      traefik.http.routers.authentik.entrypoints: websecure
      traefik.http.routers.authentik.middlewares: default@file,lan-only@file
      traefik.http.routers.authentik.tls: "true"
      traefik.http.routers.authentik.service: authentik
      traefik.http.routers.authentik.tls.certresolver: ${SERVICES_TRAEFIK_LABELS_TRAEFIK_CERTRESOLVER:-cloudflare_resolver}
      traefik.http.routers.authentik.tls.domains[0].main: ${TRAEFIK_CERT_DOMAIN}
      traefik.http.routers.authentik.tls.domains[0].sans: ${TRAEFIK_CERT_WILDCARD}
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
    networks:
      authentik_internal:
        ipv4_address: ${AUTHENTIK_SERVER_INTERNAL_IPV4:-172.31.0.20}
        ipv6_address: ${AUTHENTIK_SERVER_INTERNAL_IPV6:-fd00:1:be:d::20}
      proxy:
        ipv4_address: ${AUTHENTIK_SERVER_PROXY_IPV4:-172.31.128.20}
        ipv6_address: ${AUTHENTIK_SERVER_PROXY_IPV6:-fd00:1:be:a::20}
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ${ABSOLUTE_PATH}/data/authentik/media:/data
      - ${ABSOLUTE_PATH}/data/authentik/custom-templates:/templates:ro

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8}
    container_name: authentik-worker
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
      socket-proxy-authentik:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?Run ./scripts/setup.sh to generate secrets}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Run ./scripts/setup.sh to generate secrets}
      DOCKER_HOST: tcp://socket-proxy-authentik:2375
    networks:
      authentik_internal:
        ipv4_address: ${AUTHENTIK_WORKER_IPV4:-172.31.0.30}
        ipv6_address: ${AUTHENTIK_WORKER_IPV6:-fd00:1:be:d::30}
      authentik_socket_proxy:
        ipv4_address: ${AUTHENTIK_WORKER_SOCKET_PROXY_IPV4:-172.31.194.20}
        ipv6_address: ${AUTHENTIK_WORKER_SOCKET_PROXY_IPV6:-fd00:1:be:f::20}
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - ${ABSOLUTE_PATH}/data/authentik/media:/data
      - ${ABSOLUTE_PATH}/data/authentik/certs:/certs
      - ${ABSOLUTE_PATH}/data/authentik/custom-templates:/templates:ro
      - ${ABSOLUTE_PATH}/data/authentik/blueprints:/blueprints/custom


volumes:
  authentik_database:
    name: authentik_database

